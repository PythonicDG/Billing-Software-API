# ==============================================================================
# Nginx Server Configuration File (fataka_nginx.conf)
# ==============================================================================
# Custom secure server block mapping ports 80/443 directly to Gunicorn socket.
# ==============================================================================

# --- Upstream Connection Pool ---
# Maps Nginx reverse-proxy to the Gunicorn Unix Socket.
upstream fataka_api_server {
    server unix:/run/fataka_api.sock fail_timeout=0;
}

# --- HTTP Server Block (Port 80) ---
# Automatically catches all unencrypted HTTP traffic and redirects permanently to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name http://api.vighnahartafataka.crabdance.com; # Replace with your actual domain or server IP

    # Global request body limit (allows up to 25MB product image uploads)
    client_max_body_size 25M;

    # Certbot/Let's Encrypt validation endpoint
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server Block (Port 443) ---
# Enforces encryption and serves Vighnaharta Fataka API securely.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.vighnahartafataka.com; # Replace with your actual domain or server IP

    # --- SSL Certificate Parameters ---
    # Managed by Certbot / Let's Encrypt (paths will be auto-filled by Certbot)
    ssl_certificate /etc/letsencrypt/live/api.vighnahartafataka.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.vighnahartafataka.com/privkey.pem;
    
    # Secure SSL Protocols and Ciphers (Industry standard A+ security)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Performance Tuning ---
    client_max_body_size 25M;
    keepalive_timeout 15;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Logging ---
    access_log /var/log/nginx/fataka_api_access.log combined;
    error_log /var/log/nginx/fataka_api_error.log warn;

    # --- Static Assets Ingress ---
    # High-speed static asset routing served directly by Nginx (bypasses Django workers)
    location /static/ {
        # Absolute path to your collected static files
        alias /home/ubuntu/fataka_app/Billing-Software-API/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --- Media File Ingress ---
    # Direct access to user uploads (receipt scans, product images) served directly by Nginx
    location /media/ {
        # Absolute path to your media uploads
        alias /home/ubuntu/fataka_app/Billing-Software-API/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # --- Reverse Proxy Core (Porting requests to Gunicorn) ---
    location / {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        
        # Prevent proxy buffering issues during large data transmissions
        proxy_redirect off;
        proxy_buffering off;

        # Forward request to Gunicorn upstream socket pool
        proxy_pass http://fataka_api_server;

        # Timeouts matching Gunicorn settings (bypasses gateway timeouts during PDF loads)
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
